<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Renderer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="canvas-section">
            <h1 class="title">WebGPU Renderer</h1>
            <canvas id="gfx-main" width="1024" height="600"></canvas>
            <div class="info-section">
                <div class="info-item">
                    <div class="info-label">Current Key</div>
                    <div class="info-value" id="key-label">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Mouse X</div>
                    <div class="info-value" id="mouse-x-label">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Mouse Y</div>
                    <div class="info-value" id="mouse-y-label">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">FPS</div>
                    <div class="info-value" id="fps-label">60</div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <!-- Light Card -->
            <div class="card">
                <div class="card-title">🔆 Light</div>
                <div class="card-content">
                    <div class="property">
                        <span class="property-label">Type</span>
                        <span class="property-value">Point</span>
                    </div>
                    <div class="property-axis">
                        <span class="property-label">Position</span>
                        <div class="property-value position-inputs">
                            <input type="number" id="light-pos-x" class="axis-input axis-x" value="0" step="0.1" />
                            <input type="number" id="light-pos-y" class="axis-input axis-y" value="0" step="0.1" />
                            <input type="number" id="light-pos-z" class="axis-input axis-z" value="0" step="0.1" />
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Color</span>
                        <div class="color-picker-container">
                            <input type="color" id="light-color" value="#ffffff" class="color-picker">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Energy</span>
                        <div class="slider-container">
                            <input type="range" id="light-energy" min="0" max="10" step="0.01" value="1.0" class="slider">
                            <span class="slider-value" id="light-energy-value">1.0</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Shadow</span>
                        <span class="property-value">
                            <span class="status-indicator status-on"></span>On
                        </span>
                    </div>
                </div>
            </div>

            <!-- Material Card -->
            <div class="card">
                <div class="card-title">🎨 Material</div>
                <div class="card-content">
                    <div class="property">
                        <span class="property-label">Color</span>
                        <div class="color-picker-container">
                            <input type="color" id="material-color" value="#ffffff" class="color-picker">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Metallic</span>
                        <div class="slider-container">
                            <input type="range" id="material-metallic" min="0" max="1" step="0.01" value="0.0" class="slider">
                            <span class="slider-value" id="material-metallic-value">0.0</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Specular</span>
                        <div class="slider-container">
                            <input type="range" id="material-specular" min="0" max="1" step="0.01" value="0.5" class="slider">
                            <span class="slider-value" id="material-specular-value">0.5</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Roughness</span>
                        <div class="slider-container">
                            <input type="range" id="material-roughness" min="0" max="1" step="0.01" value="0.5" class="slider">
                            <span class="slider-value" id="material-roughness-value">0.5</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dist/main.js"></script>
</body>
</html>
