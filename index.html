<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Renderer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="canvas-section">
            <h1 class="title">WebGPU Renderer</h1>
            <canvas id="gfx-main" width="1024" height="600"></canvas>
        </div>

        <div class="right-panel">
            <!-- Camera Card -->
            <div class="card">
                <div class="card-title">📷 Camera</div>
                <div class="card-content">
                    <div class="property">
                        <span class="property-label">Fov</span>
                        <div class="slider-container">
                            <input type="range" id="camera-fov" min="1.0" max="179.0" step="1.0" value="60.0" class="slider">
                            <span class="slider-value" id="camera-fov-value">60.0</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Near</span>
                        <div class="slider-container">
                            <input type="range" id="camera-near" min="0.001" max="10.0" step="0.001" value="0.1" class="slider">
                            <span class="slider-value" id="camera-near-value">0.1</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Far</span>
                        <div class="slider-container">
                            <input type="range" id="camera-far" min="0.01" max="4000.0" step="0.01" value="3000.0" class="slider">
                            <span class="slider-value" id="camera-far-value">3000.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Environment Card -->
            <div class="card">
                <div class="card-title">🌐 Environment</div>
                <div class="card-content">
                    <div class="property">
                        <span class="property-label">Fog</span>
                        <span class="property-value">
                            <input type="checkbox" id="fog-checkbox" checked>
                        </span>
                    </div>
                    <div class="property">
                        <span class="property-label">Color</span>
                        <div class="color-picker-container">
                            <input type="color" id="fog-color" value="#ffffff" class="color-picker">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Density</span>
                        <div class="slider-container">
                            <input type="range" id="fog-density" min="0.0" max="5.0" step="0.001" value="0.02" class="slider">
                            <span class="slider-value" id="fog-density-value">0.02</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Sky Effect</span>
                        <div class="slider-container">
                            <input type="range" id="fog-sky-effect" min="0.0" max="1.0" step="0.01" value="0.5" class="slider">
                            <span class="slider-value" id="fog-sky-effect-value">0.5</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Depth Fog</span>
                        <span class="property-value">
                            <input type="checkbox" id="depth-fog-checkbox" unchecked>
                        </span>
                    </div>
                    <div class="property">
                        <span class="property-label">Near</span>
                        <div class="slider-container">
                            <input type="range" id="fog-near" min="0.0" max="5.0" step="0.01" value="1.0" class="slider">
                            <span class="slider-value" id="fog-near-value">1.0</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Far</span>
                        <div class="slider-container">
                            <input type="range" id="fog-far" min="0.0" max="10.0" step="0.01" value="4.0" class="slider">
                            <span class="slider-value" id="fog-far-value">4.0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Light Card -->
            <div class="card">
                <div class="card-title">🔆 Light</div>
                <div class="card-content">
                    <div class="property">
                        <span class="property-label">Type</span>
                        <span class="property-value">Directional</span>
                    </div>
                    <div class="property-axis">
                        <span class="property-label">Position</span>
                        <div class="property-value position-inputs">
                            <input type="number" id="light-pos-x" class="axis-input axis-x" value="0" step="0.1" />
                            <input type="number" id="light-pos-y" class="axis-input axis-y" value="0" step="0.1" />
                            <input type="number" id="light-pos-z" class="axis-input axis-z" value="0" step="0.1" />
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Color</span>
                        <div class="color-picker-container">
                            <input type="color" id="light-color" value="#ffffff" class="color-picker">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Energy</span>
                        <div class="slider-container">
                            <input type="range" id="light-energy" min="0" max="10" step="0.01" value="2.0" class="slider">
                            <span class="slider-value" id="light-energy-value">2.0</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Shadow</span>
                        <span class="property-value">
                            <input type="checkbox" id="shadow-checkbox" checked>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Material Card -->
            <div class="card">
                <div class="card-title">🎨 Material</div>
                <div class="card-content">
                    <div class="property">
                        <span class="property-label">Color</span>
                        <div class="color-picker-container">
                            <input type="color" id="material-color" value="#ffffff" class="color-picker">
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Metallic</span>
                        <div class="slider-container">
                            <input type="range" id="material-metallic" min="0" max="1" step="0.01" value="0.0" class="slider">
                            <span class="slider-value" id="material-metallic-value">0.0</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Specular</span>
                        <div class="slider-container">
                            <input type="range" id="material-specular" min="0" max="1" step="0.01" value="0.5" class="slider">
                            <span class="slider-value" id="material-specular-value">0.5</span>
                        </div>
                    </div>
                    <div class="property">
                        <span class="property-label">Roughness</span>
                        <div class="slider-container">
                            <input type="range" id="material-roughness" min="0" max="1" step="0.01" value="1.0" class="slider">
                            <span class="slider-value" id="material-roughness-value">1.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="dist/main.js"></script>
</body>
</html>
